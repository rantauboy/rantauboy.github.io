name: Deploy Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.release.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Inject
        env:
          AD2C8E: ${{ secrets.AD2C8E }}
          B4D97D: ${{ secrets.B4D97D }}
        run: |
          python3 -c "
          import os, sys, pathlib
          a, b = os.environ.get('AD2C8E', ''), os.environ.get('B4D97D', '')
          html = pathlib.Path('index.html')
          text = html.read_text(encoding='utf-8')
          patched = text
          if a:
              patched = patched.replace('<!-- 3b562e42b6473869ee4a -->', a)
          if b:
              patched = patched.replace('<!-- 6819c666d4d95ae205b51e101249e10e1a22dac97b -->', b)
          if patched == text and (a or b):
              sys.exit(1)
          if patched != text:
              html.write_text(patched, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: release
        uses: actions/deploy-pages@v4
